name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  sql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creditrisk
          POSTGRES_PASSWORD: creditrisk
          POSTGRES_DB: creditrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate the SQL scripts against PostgreSQL
        env:
          PGPASSWORD: creditrisk
        run: |
          for f in sql/01_create_tables.sql sql/02_aggregate_bureau.sql sql/03_build_model_table.sql; do
            echo "applying $f"
            psql -h localhost -U creditrisk -d creditrisk -v ON_ERROR_STOP=1 -f "$f"
          done
