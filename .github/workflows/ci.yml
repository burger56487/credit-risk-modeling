name: 研究项目自动验收

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: 语法、静态检查、测试与覆盖率（不连数据库）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置解释器
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置环境工具
        uses: astral-sh/setup-uv@v5

      - name: 检查锁文件已提交
        run: git ls-files --error-unmatch uv.lock

      - name: 按锁文件安装依赖
        run: |
          # 依赖下载偶发被 CDN 拒绝，重试几次再判定失败
          for attempt in 1 2 3; do
            if uv sync --frozen --all-extras; then exit 0; fi
            echo "第 $attempt 次安装失败，稍后重试"
            sleep 5
          done
          exit 1

      - name: 检查语法
        run: uv run --frozen python -m compileall -q src apps

      - name: 基础静态错误检查
        run: uv run --frozen ruff check src apps tests

      - name: 运行全部测试与覆盖率门槛
        run: >
          uv run --frozen python -m pytest
          --cov=src
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --junitxml=reports/test-results.xml

      - name: 保存验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 自动验收报告
          path: |
            reports/coverage.xml
            reports/test-results.xml
          if-no-files-found: warn

  postgres-pipeline:
    name: PostgreSQL 实库装载验收（装载、回滚、并发、快照）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creditrisk
          # 短生命周期测试库专用凭据，不复用任何真实环境口令
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: creditrisk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 检查锁文件已提交
        run: git ls-files --error-unmatch uv.lock

      - name: 配置解释器
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置环境工具
        uses: astral-sh/setup-uv@v5

      - name: 按锁文件安装依赖
        run: |
          # 这个作业只需要实库测试用到的依赖，不装看板额外依赖
          for attempt in 1 2 3; do
            if uv sync --frozen --extra postgres; then exit 0; fi
            echo "第 $attempt 次安装失败，稍后重试"
            sleep 5
          done
          exit 1

      - name: 用 psql 初始化真实表结构
        env:
          PGPASSWORD: ci_test_password
        run: >
          psql -h localhost -U creditrisk -d creditrisk_test
          -v ON_ERROR_STOP=1 -f sql/01_create_tables.sql

      - name: 连接配置缺失时必须失败
        run: |
          if uv run --frozen python -c "from src.data_layer.ingest_to_db import get_engine; get_engine()"; then
            echo "缺少 CREDITRISK_DB_URL 时不应成功"
            exit 1
          fi

      - name: 运行实库装载验收与全部测试
        env:
          CREDITRISK_TEST_DB_URL: postgresql+psycopg2://creditrisk:ci_test_password@127.0.0.1:5432/creditrisk_test
        run: >
          uv run --frozen python -m pytest
          --cov=src
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:reports/coverage-postgres.xml
          --junitxml=reports/test-results-postgres.xml

      - name: 保存实库验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 实库验收报告
          path: |
            reports/coverage-postgres.xml
            reports/test-results-postgres.xml
          if-no-files-found: warn

      - name: 实库测试不得被跳过
        run: |
          # 连接配置缺失或失联时必须失败，不能“跳过后全绿”
          uv run --frozen python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("reports/test-results-postgres.xml")
          if not report.is_file():
              sys.exit("没有生成实库测试报告，无法确认测试是否真的执行")

          skipped = [
              case.get("name")
              for case in ET.parse(report).iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              sys.exit(f"实库作业出现跳过，连接配置可能有误：{skipped}")

          print("实库测试全部实际执行，无跳过")
          PY
